# Written by ai-scanner-installer for this environment. Jenkins edits the image lines.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base
patches:
  - path: app-patch.yaml
  - path: pvc-patch.yaml
  - path: lmstudio-patch.yaml
  - path: storage-patch.yaml
    target:
      kind: StorageClass
      name: reports-noexec
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: ai-scan-repos
