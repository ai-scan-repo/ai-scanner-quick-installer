# Written by ai-scanner-installer for this environment. Jenkins edits the image lines.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-api
  namespace: ai-scan-repos
spec:
  template:
    spec:
      containers:
        - name: review-api
          image: 10.96.100.100:5000/review-api:bootstrap
          env:
            - name: SCANNER_WORKER_IMAGE
              value: 10.96.100.100:5000/scanner-worker:bootstrap
            - name: LMSTUDIO_BASE_URL
              value: http://lmstudio:1234/v1
