# The React UI's Kubernetes objects, as one Kustomize unit, complete on its own.
#
#   kubectl kustomize .     print exactly what would be applied (changes nothing)
#
# Deployed by the Argo CD Application "ai-scan-frontend", which points at this
# repository (path ".", branch main). Argo CD clones ONE repository per
# Application, so nothing here may refer to another repository (no ../).
# Change the cluster by committing here; Argo CD applies the commit.
#
# Needs the ai-scan-repos namespace and the Ingress that routes to it, both
# from ai-scanner-backend-deployment.
#
# Before the split this was Code-Review-MCP/k8s/frontend/ inside
# hadsahar/DevSecOps-Final-Project.
apiVersion: kustomize.config.k8s.io/v1beta1       # the Kustomize config format version
kind: Kustomization                               # this file describes a set of manifests to apply together

resources:                                        # the files that make up the UI
  - deployment.yaml                               # the React UI (nginx, uid 101), Deployment and Service

images:                                           # rewrite image references in the manifests above
  - name: review-frontend                         # every "image: review-frontend" ...
    newName: 10.0.0.39:30500/review-frontend                    # set by Jenkins: the registry it was pushed to
    newTag: 10fb5a2                               # set by Jenkins: the commit it was built from
